name: Publish to npm
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact stable version already committed on main
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: publish-npm
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      SDK_LOCAL_SOURCE: '0'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Validate committed release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module -e "import fs from 'node:fs'; if (JSON.parse(fs.readFileSync('package.json', 'utf8')).version !== process.env.RELEASE_VERSION) throw new Error('Requested version must match package.json');"
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - name: Pack release
        run: |
          mkdir -p release-package
          npm pack --ignore-scripts --pack-destination release-package
      - name: Publish with OIDC provenance
        run: npm publish release-package/*.tgz --ignore-scripts --access public --provenance
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        run: gh release create "v${RELEASE_VERSION}" --target "$RELEASE_SHA" --title "Multi Agent SDK ${RELEASE_VERSION}" --generate-notes
