name: Publish to npm
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact stable version already committed on main
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: publish-npm
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      SDK_LOCAL_SOURCE: '0'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Validate committed release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/check-release.mjs
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - name: Publish with OIDC provenance
        run: npm publish --access public --provenance
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        run: gh release create "v${RELEASE_VERSION}" --target "$RELEASE_SHA" --title "Multi Agent SDK ${RELEASE_VERSION}" --generate-notes
